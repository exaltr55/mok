[project]
name = "mok"
version = "0.1.0"
description = "mok — base AI application (Python + React)"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Config & validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    # Authentication
    "PyJWT>=2.8.0",
    "bcrypt>=4.0.0",
    # Utilities
    "python-ulid>=3.0.0",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
    # Email (system-level transactional mail)
    "email-validator>=2.2.0",
    # Shared LLM provider abstraction
    "llm-client",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "aiosqlite>=0.20.0",  # in-memory DB for tests
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]  # Depends() in defaults is FastAPI convention

[tool.ruff.lint.isort]
known-first-party = ["mok"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.uv.sources]
llm-client = { git = "ssh://git@github.com/clapself/llm-client.git", branch = "main" }
