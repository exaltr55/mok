services:
  postgres:
    image: postgres:16-alpine
    container_name: mok-postgres
    environment:
      POSTGRES_USER: mok
      POSTGRES_PASSWORD: mok
      POSTGRES_DB: mok
    ports:
      - "5432:5432"
    volumes:
      - mok-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mok"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mok-postgres-data:
